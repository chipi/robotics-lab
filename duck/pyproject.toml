[project]
name = "duck-lab"
version = "0.1.0"
description = "Our tools around Pollen's Microduck: simulator scenes, probes, MCAP recording"
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.2",
]

[project.scripts]
duck-record = "duck_lab.record:main"
duck-to-rerun = "duck_lab.to_rerun:main"
duck-go = "duck_lab.nav.run:main"
duck-eval = "duck_lab.nav.evaluate:main"
duck-explore = "duck_lab.nav.explore_run:main"
duck-rooms = "duck_lab.nav.rooms:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duck_lab"]

[dependency-groups]
dev = [
    "rerun-sdk>=0.39.0",
]
