[project]
name = "duck-lab"
version = "0.1.0"
description = "Our tools around Pollen's Microduck: simulator scenes, probes, MCAP recording"
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.2",
]

[project.scripts]
duck-record = "duck_lab.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duck_lab"]
