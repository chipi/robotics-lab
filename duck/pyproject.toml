[project]
name = "duck-lab"
version = "0.1.0"
description = "Our tools around Pollen's Microduck: simulator scenes, probes, MCAP recording"
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.2",
    "robotgate",
    "runfile",
    "worldmodel",
]

# The navigator writes its runs as miniview runs (ADR-0014): the run format is a path source (libs/runfile), not a release.
[tool.uv.sources]
robotgate = { path = "../libs/gate", editable = true }
runfile = { path = "../libs/runfile", editable = true }
worldmodel = { path = "../libs/worldmodel", editable = true }

[project.scripts]
duck-record = "duck_lab.record:main"
duck-to-rerun = "duck_lab.to_rerun:main"
duck-go = "duck_lab.nav.run:main"
duck-eval = "duck_lab.nav.evaluate:main"
duck-explore = "duck_lab.nav.explore_run:main"
duck-site = "duck_lab.site_cli:main"
duck-replay = "duck_lab.replay:main"
duck-rooms = "duck_lab.nav.rooms:main"
duck-world = "duck_lab.world:main"
duck-challenge = "duck_lab.challenge.run:main"
duck-gate = "duck_lab.gate_proxy:main"
duck-nav-server = "duck_lab.nav.server:main"
duck-pic = "duck_lab.miniview:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duck_lab"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "rerun-sdk>=0.39.0",
]
