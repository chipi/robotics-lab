[project]
name = "miniview"
version = "0.1.0"
description = "Seeing what a robot believed, against what happened — for people and agents, any robot (PRD-001, RFC-0009)"
requires-python = ">=3.10"
dependencies = [
    "foxglove-schemas-protobuf>=0.4.0",
    "mcap>=1.2",
    "protobuf>=7.36.2",
]

[project.scripts]
miniview = "miniview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniview"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
]
