# miniview's service: `make viewer-up` / `make viewer-down` (RFC-0009 "Running in Docker", ADR-0012).
# Published on loopback only. The lab's runs and scenes are mounted READ ONLY: the viewer cannot change a
# record. The index is ONE: the host's state folder (MINIVIEW_STATE, the folder of the commands' MINIVIEW_INDEX) is
# mounted writable at /index, so the service and the commands share it; while the service holds it, the commands
# only read it. Imports and writers run on the host, never in this container.
# MINIVIEW_DATA and MINIVIEW_STATE are the host's folders; the workstation's paths are the defaults here and in the Makefile only.
name: miniview
services:
  miniview:
    build: .
    image: "miniview:${MINIVIEW_IMAGE_TAG:-local}"
    user: "${MINIVIEW_UID:-1000}:${MINIVIEW_GID:-1000}"
    ports:
      - "127.0.0.1:${MINIVIEW_PORT:-8070}:8070"
    environment:
      MINIVIEW_DATA: /data
      MINIVIEW_INDEX: /index/index.sqlite
      MINIVIEW_ROBOTS: /robots
    volumes:
      # the robots' descriptions and meshes (RFC-0011), read only like the runs
      - type: bind
        source: ../robots
        target: /robots
        read_only: true
      - type: bind
        source: "${MINIVIEW_DATA:-/work/robotics-lab/data}/runs"
        target: /data/runs
        read_only: true
      - type: bind
        source: "${MINIVIEW_DATA:-/work/robotics-lab/data}/scenes"
        target: /data/scenes
        read_only: true
      - type: bind
        source: "${MINIVIEW_STATE:-/work/robotics-lab/state/miniview}"
        target: /index
    mem_limit: "${MINIVIEW_MEM:-768m}"
    restart: unless-stopped
