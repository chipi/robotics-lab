# Build, test and check every project in the repo: the NXT web UI (apps/nxt-web/), the duck's navigator and
# tools (duck/), and the Observatory (apps/observatory/). The docs have their own workflow (docs.yml).
#
# Each job runs the same make targets as on the workstation, so a red job reproduces locally with
# the target named in its step:
#   unit   → make check-boundaries ci-fast   package boundaries (RFC-0018), lint, every project's unit tests
#   pages  → make test-observatory-pages test-control-page test-nxt-page   the Observatory's two pages, Mission Control's page and nxt-web's page in headless Chromium
#   compat → make test-run-compat    a run opens in Rerun and the Observatory (Lichtblick's checks skipped)
#   images → make test-integration test-observatory-image nxt-programs   the Docker images, the NXC programs

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.12.10'

jobs:
  unit:
    name: Unit tests (nxt, duck, observatory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - name: "make check-boundaries (RFC-0018: which package may import which)"
        run: make check-boundaries
      - name: make ci-fast
        run: make ci-fast

  pages:
    name: Observatory pages (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - name: Playwright's Chromium
        run: make observatory-sync && cd apps/observatory && uv run --frozen playwright install --with-deps chromium
      - name: make test-observatory-pages
        run: make test-observatory-pages
      # keyed on the Makefile's LDRAW_ZIP_SHA256: ldraw.org is fetched once per library version, not on every run
      - name: The LDraw library's pinned hash
        id: ldraw
        run: echo "sha=$(make -s ldraw-sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/opt/ldraw
          key: ldraw-${{ steps.ldraw.outputs.sha }}
      - name: "The NXT's meshes (make ldraw-fetch robots-lego): test_nxt_page skips without them"
        run: make ldraw-fetch robots-lego
      - name: make test-control-page
        run: |
          # no pipe: the runner's default bash has no pipefail, so a failed make would not fail the step
          make test-control-page > "$RUNNER_TEMP/control-page.log" 2>&1 || { cat "$RUNNER_TEMP/control-page.log"; exit 1; }
          cat "$RUNNER_TEMP/control-page.log"
          # a missing mesh set prints SKIP and exits 0: after the step above the NXT's must not (the duck's are built from Pollen's MuJoCo model, which CI has not)
          if grep -q '^SKIP test_nxt_page' "$RUNNER_TEMP/control-page.log"; then echo "test_nxt_page skipped: its meshes were not built"; exit 1; fi
      - name: make test-nxt-page
        run: make test-nxt-page

  compat:
    name: A run opens in Rerun and the Observatory (Lichtblick skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - name: Playwright's Chromium
        run: make observatory-sync && cd apps/observatory && uv run --frozen playwright install --with-deps chromium
      - name: make test-run-compat (Rerun from robots/duck/.venv, Observatory)
        run: make test-run-compat

  images:
    name: Images and NXC programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make test-integration (the NXT web UI image)
        run: make test-integration
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv (the image test imports a fixture run on the host, as production does)
        run: pip install "uv==${UV_VERSION}"
      - name: "make test-observatory-image (the Observatory's image: data read only, index on its own volume)"
        run: make observatory-sync && make test-observatory-image
      - name: make nxt-programs
        run: make nxt-programs
