[project]
name = "mission-control"
version = "0.1.0"
description = "Mission Control (RFC-0014): one API for every robot, goals, sites and areas; every robot behind the gate of RFC-0017"
requires-python = ">=3.10"
dependencies = [
    "robotgate",
    "runfile",
    "missions",
    "mcp>=2.3.0",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

# No robot's package (phase 5 step 1, the operator's decision a): a robot is found by its registration file, named in the installation
# file. The tests drive the real gate proxy and the simulator's host, so the runner and the host library are theirs only.
[dependency-groups]
dev = [
    "labrunner",
    "simhost",
]

# The gate (RFC-0017) and mission planning (RFC-0030) are libraries (libs/gate, libs/missions), path sources like the run format, so there is one copy of the rules.
[tool.uv.sources]
labrunner = { path = "../../libs/runner", editable = true }
robotgate = { path = "../../libs/gate", editable = true }
missions = { path = "../../libs/missions", editable = true }
runfile = { path = "../../libs/runfile", editable = true }
simhost = { path = "../../libs/simhost", editable = true }
worldmodel = { path = "../../libs/worldmodel", editable = true }

[project.scripts]
mission-control = "mission_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]
