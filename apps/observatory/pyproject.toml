[project]
name = "observatory"
version = "0.1.0"
description = "Seeing what a robot believed, against what happened — for people and agents, any robot (PRD-001, RFC-0009)"
requires-python = ">=3.10"
dependencies = [
    "runfile",
    "mcp>=2.3.0",
]

# the run format is a library beside the apps (RFC-0018): a path source, so there is one copy
[tool.uv.sources]
runfile = { path = "../../libs/runfile", editable = true }

[project.scripts]
observatory = "observatory.cli:main"
# the old name, kept for one release (RFC-0018): scripts and habits that run `miniview` still work
miniview = "observatory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
]
