[project]
name = "duck-lab"
version = "0.1.0"
description = "Pollen's Microduck: its profile and plugins, its navigator (a payload), its simulator scenes and probes, its tools"
requires-python = ">=3.10"
dependencies = [
    "labrunner",
    "mcap>=1.2",
    "onnxruntime>=1.24.3",
    "robotgate",
    "runfile",
    "simhost",
    "worldmodel",
]

# The navigator writes its runs as Observatory runs (ADR-0014): the libraries are path sources (libs/), not releases.
# labrunner is the runner (RFC-0022): the duck's tools and the runner's commands live in one environment; the navigator
# itself never imports it (scripts/check_boundaries.py).
[tool.uv.sources]
labrunner = { path = "../../libs/runner", editable = true }
robotgate = { path = "../../libs/gate", editable = true }
runfile = { path = "../../libs/runfile", editable = true }
simhost = { path = "../../libs/simhost", editable = true }
worldmodel = { path = "../../libs/worldmodel", editable = true }

[project.scripts]
duck-record = "duck_lab.record:main"
duck-to-rerun = "duck_lab.to_rerun:main"
duck-go = "labrunner.aliases:duck_go"
duck-eval = "labrunner.aliases:duck_eval"
duck-explore = "labrunner.aliases:duck_explore"
duck-site = "duck_lab.site_cli:main"
duck-replay = "duck_lab.replay:main"
duck-rooms = "labrunner.aliases:duck_rooms"
duck-world = "duck_lab.world:main"
duck-challenge = "labrunner.aliases:duck_challenge"
duck-gate = "labrunner.aliases:duck_gate"
duck-nav-server = "labrunner.aliases:duck_nav_server"
duck-payload = "duck_lab.payload:main"
duck-pic = "duck_lab.miniview:main"

# The duck as a robot the runner can find by name (labrunner.robots, RFC-0022)
[project.entry-points."robotics_lab.robots"]
duck = "duck_lab.robot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duck_lab"]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "rerun-sdk>=0.39.0",
]
