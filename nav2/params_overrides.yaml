# Nav2's configuration for the simulated duck (RFC-0015 §3.4), as overrides on nav2_bringup's own nav2_params.yaml
# (merge_params.py: dicts merge, lists are replaced, "base_footprint" becomes "base_link"). The closed list of adapted
# parameters; everything else is Jazzy's default. Spike version: 2026-11-18, nothing here is frozen.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_time: 1.5
      lookahead_dist: 0.3
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: true
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12
      track_unknown_space: true
      plugins: ["obstacle_layer", "drop_layer", "inflation_layer"]
      obstacle_layer: &obstacle_layer
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "depth_mark depth_clear"
        depth_mark:
          topic: /depth/obstacles
          data_type: PointCloud2
          sensor_frame: base_link
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 0.35
          obstacle_max_range: 0.8
          obstacle_min_range: 0.0
        depth_clear:
          topic: /depth/floor
          data_type: PointCloud2
          sensor_frame: base_link
          marking: false
          clearing: true
          min_obstacle_height: -0.05
          max_obstacle_height: 0.05
          raytrace_max_range: 0.8
          raytrace_min_range: 0.0
      drop_layer: &drop_layer
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        observation_sources: "drops"
        drops:
          topic: /drops
          data_type: PointCloud2
          sensor_frame: base_link
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 0.3
          obstacle_max_range: 1.0
          obstacle_min_range: 0.0
      inflation_layer: &inflation_layer
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.28

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      width: 10
      height: 10
      origin_x: -5.0
      origin_y: -5.0
      resolution: 0.05
      robot_radius: 0.12
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "drop_layer", "inflation_layer"]
      obstacle_layer: *obstacle_layer
      drop_layer: *drop_layer
      inflation_layer: *inflation_layer

planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      cost_travel_multiplier: 2.0

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    odom_topic: /odom

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    polygons: ["StopPolygon"]
    StopPolygon:
      type: "polygon"
      points: "[[0.30, 0.123], [0.30, -0.123], [0.0, -0.123], [0.0, 0.123]]"
      action_type: "stop"
      min_points: 2
      visualize: false
      enabled: true
    observation_sources: ["depth", "drops"]
    depth:
      type: "pointcloud"
      topic: /depth/obstacles
      min_height: 0.08
      max_height: 0.32
      enabled: true
    drops:
      type: "pointcloud"
      topic: /drops
      min_height: 0.0
      max_height: 0.3
      enabled: true
    source_timeout: 0.5
