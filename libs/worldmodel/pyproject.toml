[project]
name = "worldmodel"
version = "0.1.0"
description = "What a robot knows of a place beyond its occupancy grid (RFC-0016): objects, landmarks, the semantic map, relocalisation, sites; no robot, standard library only"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldmodel"]
