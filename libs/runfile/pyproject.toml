[project]
name = "runfile"
version = "0.1.0"
description = "The lab's run format (MCAP schemas, writer and reader, keys, importers, catalog): every robot writes it, the Observatory reads it (RFC-0018)"
requires-python = ">=3.10"
dependencies = [
    "foxglove-schemas-protobuf>=0.4.0",
    "mcap>=1.2",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runfile"]
