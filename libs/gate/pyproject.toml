[project]
name = "robotgate"
version = "0.1.0"
description = "The gate (RFC-0017): one driver per robot, the lease and the stop rules; pure rules, standard library only"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotgate"]
