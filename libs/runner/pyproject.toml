[project]
name = "labrunner"
version = "0.1.0"
description = "The runner (RFC-0021, RFC-0022): starts a robot's navigator as a payload, judges it by the simulator's truth, writes the official run; the course, the judge, the scores, the simulated camera, the gate proxy"
requires-python = ">=3.10"
dependencies = [
    "robotgate",
    "runfile",
    "simhost",
    "worldmodel",
]

# The platform's libraries are path sources (RFC-0018); a robot's package is never a dependency: robots are found by name
# (the entry-point group robotics_lab.robots, labrunner.robots).
[tool.uv.sources]
robotgate = { path = "../gate", editable = true }
runfile = { path = "../runfile", editable = true }
simhost = { path = "../simhost", editable = true }
worldmodel = { path = "../worldmodel", editable = true }

[project.scripts]
lab-challenge = "labrunner.challenge:main"
lab-eval = "labrunner.evaluate:main"
lab-explore = "labrunner.explore_run:main"
lab-go = "labrunner.go:main"
lab-nav-server = "labrunner.navapi:main"
lab-gate = "labrunner.gate:main"
lab-rooms = "labrunner.rooms:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labrunner"]
