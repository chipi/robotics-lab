[project]
name = "simhost"
version = "0.1.0"
description = "The simulator host (RFC-0021): one host file (host.json) for the robot's sockets, the reset and the truth; standard library only"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
simhost = "simhost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simhost"]
