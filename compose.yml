# The Observatory and Mission Control together (RFC-0014 §3.13): `make stack-up` / `make stack-down` (or `docker compose up -d`
# from the repository root) starts both, each from its own compose file, on loopback (the Observatory :8070, Mission Control :8060).
# Each file also works on its own (`make observatory-up`, `make control-up`). Needs Docker Compose 2.20 or newer for `include`.
# (The MINIVIEW_* names of before the rename still work where an OBSERVATORY_* one is not set.)
# This project is `robotics-lab`; `make observatory-up` runs the project `observatory`. Do not start both while one holds :8070: the ports
# are OBSERVATORY_PORT and MC_PORT (the Makefile's STACK_VIEWER_PORT and STACK_CONTROL_PORT), the image tags OBSERVATORY_IMAGE_TAG and
# MC_IMAGE_TAG, and each service's memory is capped (OBSERVATORY_MEM 768m, MC_MEM 512m).
name: robotics-lab
include:
  - apps/observatory/compose.yml
  - apps/mission-control/compose.yml
